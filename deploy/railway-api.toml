# Railway config for the "api" service only.
# In Railway: storefront → Settings → set Config file to this path (see deploy/RAILWAY-CONFIG.md)

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/api.Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
