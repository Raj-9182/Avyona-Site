# API service ONLY — root directory must stay empty on Railway "api" service.
# storefront/admin must NOT use this file (see deploy/railway-CONNECT.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/api.Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
